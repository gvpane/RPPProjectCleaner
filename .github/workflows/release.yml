name: Publish CleanWavFiles Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
        contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish CleanWavFiles
        run: dotnet publish CleanWavFiles/CleanWavFiles.csproj -c Release -r win-x64 --self-contained -o publish/CleanWavFiles /p:PublishSingleFile=true

      - name: Zip published files
        run: Compress-Archive -Path publish/CleanWavFiles/* -DestinationPath CleanWavFiles.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: CleanWavFiles.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
